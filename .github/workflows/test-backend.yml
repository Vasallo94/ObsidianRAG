name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.12'

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev --python ${{ matrix.python-version }}

      - name: Verify Python version
        run: uv run python -c "import sys; assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python-version }}'.split('.')))"

      - name: Run linting
        run: |
          uv run ruff check obsidianrag/ tests/
          uv run ruff format --check obsidianrag/ tests/

      - name: Run unit tests
        run: uv run pytest tests/ -m "not integration and not slow" --cov=obsidianrag --cov-report=xml --cov-report=term-missing --cov-fail-under=30

      # Integration tests are skipped in CI because they require Ollama
      # Run them locally with: uv run pytest tests/ -m "integration"
      # - name: Run integration tests
      #   run: |
      #     uv run pytest tests/ -m "integration and not slow" \
      #       --cov=obsidianrag \
      #       --cov-append \
      #       --cov-report=xml

      - name: Verify package artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          uv build
          uv run python scripts/verify_dist.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  type-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --dev --python 3.11

      - name: Verify Python version
        run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 11)"

      - name: Run type checking
        run: uv run mypy .
        continue-on-error: false
