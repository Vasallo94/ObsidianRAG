name: Plugin Tests

on:
  push:
    branches: [main, v3-plugin]
    paths:
      - 'plugin/**'
      - '.github/workflows/test-plugin.yml'
  pull_request:
    branches: [main, v3-plugin]
    paths:
      - 'plugin/**'
      - '.github/workflows/test-plugin.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: 'plugin/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm exec tsc --noEmit --skipLibCheck

      - name: Test
        run: pnpm test
