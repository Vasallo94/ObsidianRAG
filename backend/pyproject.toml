[project]
name = "obsidianrag"
version = "4.0.1"
description = "RAG system for querying Obsidian notes with SQLite FTS5 and LanceDB"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Enrique Vasallo"}
]
keywords = ["obsidian", "rag", "langchain", "lancedb", "sqlite", "ollama", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    # Core LangChain ecosystem
    "langchain-core>=0.3.15",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    # Vector store and retrieval
    "lancedb>=0.36.0,<0.37.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.13.0",

    # API
    "fastapi>=0.115.4",
    "uvicorn>=0.32.0",
    "httpx>=0.27.2",

    # Configuration and utilities
    "pydantic>=2.9.0",
    "pydantic-settings>=2.14.2",

    # CLI
    "typer>=0.12.5",
    "rich>=13.9.0",
]

[project.urls]
Homepage = "https://github.com/Vasallo94/ObsidianRAG"
Repository = "https://github.com/Vasallo94/ObsidianRAG"
Documentation = "https://github.com/Vasallo94/ObsidianRAG#readme"
Issues = "https://github.com/Vasallo94/ObsidianRAG/issues"

[project.scripts]
obsidianrag = "obsidianrag.cli.main:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obsidianrag"]

[tool.hatch.build.targets.sdist]
include = [
    "/obsidianrag",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.7",
]
